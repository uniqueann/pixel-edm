<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">DirectMail 投递回执链路</title>
  <desc id="desc">正式活动经邮件推送发送，阿里云 EventBridge 通过完整事件和 Token 投递到本站 Webhook，更新活动统计。</desc>
  <defs>
