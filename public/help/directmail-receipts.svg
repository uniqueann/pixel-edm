      <stop stop-color="#f6f8f4"/>
      <stop offset="1" stop-color="#edf2f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#122836" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="960" height="300" fill="url(#bg)"/>
  <path d="M0 42h960M0 258h960" stroke="#dce6e0" stroke-width="1"/>
  <text x="32" y="35" fill="#234238" font-size="13" font-weight="700" font-family="Arial, PingFang SC, sans-serif" letter-spacing="2">真实回执链路</text>

  <g filter="url(#shadow)">
    <rect x="32" y="74" width="198" height="160" rx="18" fill="#fff"/>
    <rect x="265" y="74" width="198" height="160" rx="18" fill="#fff"/>
    <rect x="498" y="74" width="198" height="160" rx="18" fill="#fff"/>
    <rect x="731" y="74" width="198" height="160" rx="18" fill="#fff"/>
  </g>
  <g fill="none" stroke="#72947e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 153h18m-7-7 7 7-7 7"/>
    <path d="M471 153h18m-7-7 7 7-7 7"/>
    <path d="M704 153h18m-7-7 7 7-7 7"/>
