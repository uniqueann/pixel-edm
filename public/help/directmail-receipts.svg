  <path d="M759 101h17v19h-17zM762 108l4 4 7-8" fill="none" stroke="#285d43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="749" y="158" fill="#19382f" font-size="17" font-weight="700" font-family="Arial, PingFang SC, sans-serif">本站 Webhook</text>
