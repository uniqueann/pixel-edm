  <rect x="50" y="92" width="37" height="37" rx="11" fill="#e7f1e9"/>
  <path d="M59 103h19v16H59zM59 104l9.5 8 9.5-8" fill="none" stroke="#285d43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="50" y="158" fill="#19382f" font-size="17" font-weight="700" font-family="Arial, PingFang SC, sans-serif">本站正式活动</text>
  <text x="50" y="184" fill="#5a6f62" font-size="13" font-family="Arial, PingFang SC, sans-serif">小名单真实发送</text>
  <text x="50" y="204" fill="#5a6f62" font-size="13" font-family="Arial, PingFang SC, sans-serif">先记录供应商受理</text>

  <rect x="283" y="92" width="37" height="37" rx="11" fill="#e7f1e9"/>
  <path d="M292 109h19m-15-6 7-6 7 6m-14 12 7 6 7-6" fill="none" stroke="#285d43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="283" y="158" fill="#19382f" font-size="17" font-weight="700" font-family="Arial, PingFang SC, sans-serif">DirectMail</text>
  <text x="283" y="184" fill="#5a6f62" font-size="13" font-family="Arial, PingFang SC, sans-serif">开启事件分发</text>
  <text x="283" y="204" fill="#5a6f62" font-size="13" font-family="Arial, PingFang SC, sans-serif">与 EventBridge 同区域</text>

  <rect x="516" y="92" width="37" height="37" rx="11" fill="#e7f1e9"/>
  <circle cx="534.5" cy="110.5" r="10" fill="none" stroke="#285d43" stroke-width="2"/>
  <path d="M529 110h11m-6-5 5 5-5 5" fill="none" stroke="#285d43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="516" y="158" fill="#19382f" font-size="17" font-weight="700" font-family="Arial, PingFang SC, sans-serif">EventBridge</text>
  <text x="516" y="184" fill="#5a6f62" font-size="13" font-family="Arial, PingFang SC, sans-serif">事件源 acs.dm</text>
